# The tests of every change: pushes to main and to renovate/all-patch, where Renovate's
# patches merge from once this passes (no ignoreTests in renovate.json), and pull requests.
name: Test
# A failed job mails whoever started the run. Renovate's bot has no mailbox: when its
# branch fails, Renovate opens a pull request, which mails the repository's watchers.
enable-email-notifications: true
'on':
  push:
    branches:
    - main
    - renovate/all-patch
  pull_request: null
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: https://github.com/actions/checkout@v7
    - name: Set up Python
      uses: https://github.com/actions/setup-python@v7
      with:
        python-version: '3.15'
    - name: Cache pip packages
      uses: https://github.com/actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ipython jupyter
        pip install -e .[test]
    - name: Setup ffmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    - name: Run tests
      run: pytest
